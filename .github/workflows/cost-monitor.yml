name: Cost Monitor

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9 AM
  workflow_dispatch:

jobs:
  cost-check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
    
    - name: Check AWS Costs
      run: |
        # Get current month costs
        CURRENT_COSTS=$(aws ce get-cost-and-usage \
          --time-period Start=$(date -d "$(date +%Y-%m-01)" +%Y-%m-%d),End=$(date +%Y-%m-%d) \
          --granularity MONTHLY \
          --metrics BlendedCost \
          --query 'ResultsByTime[0].Total.BlendedCost.Amount' \
          --output text)
        
        echo "Current month costs: \$${CURRENT_COSTS}"
        
        # Alert if costs exceed $5
        if (( $(echo "$CURRENT_COSTS > 5" | bc -l) )); then
          echo "⚠️ WARNING: Costs exceed \$5 threshold!"
          echo "::warning::AWS costs for this month: \$${CURRENT_COSTS}"
        else
          echo "✅ Costs within Free Tier limits: \$${CURRENT_COSTS}"
        fi
