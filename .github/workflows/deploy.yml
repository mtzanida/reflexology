name: Deploy Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
          echo "❌ AWS_ROLE_ARN secret is not set"
          exit 1
        fi
        if [ -z "${{ vars.BUCKET_NAME }}" ]; then
          echo "❌ BUCKET_NAME variable is not set"
          exit 1
        fi
        echo "✅ All required secrets and variables are configured"
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Validate bucket-contents directory
      run: |
        if [ ! -d "bucket-contents" ]; then
          echo "❌ bucket-contents directory not found"
          exit 1
        fi
        
        FILE_COUNT=$(find bucket-contents -type f | wc -l)
        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "❌ No files found in bucket-contents directory"
          exit 1
        fi
        
        echo "✅ Found $FILE_COUNT files to deploy"
    
    - name: Validate S3 bucket exists and is accessible
      run: |
        echo "🔍 Validating S3 bucket: ${{ vars.BUCKET_NAME }}"
        
        if ! aws s3api head-bucket --bucket "${{ vars.BUCKET_NAME }}" 2>/dev/null; then
          echo "❌ S3 bucket '${{ vars.BUCKET_NAME }}' does not exist or is not accessible"
          echo "Please ensure:"
          echo "  1. Bucket exists in region ${{ env.AWS_REGION }}"
          echo "  2. IAM role has s3:ListBucket and s3:GetBucketLocation permissions"
          exit 1
        fi
        
        echo "✅ S3 bucket is accessible"
    
    - name: Upload to S3 with validation
      run: |
        echo "🚀 Deploying to ${{ env.ENVIRONMENT }} environment"
        echo "📁 Syncing files to s3://${{ vars.BUCKET_NAME }}"
        
        # Perform sync with detailed output
        if aws s3 sync bucket-contents/ s3://${{ vars.BUCKET_NAME }} --delete --exact-timestamps; then
          echo "✅ S3 sync completed successfully"
        else
          echo "❌ S3 sync failed"
          exit 1
        fi
        
        # Validate sync was successful
        echo "🔍 Validating deployment..."
        REMOTE_COUNT=$(aws s3 ls s3://${{ vars.BUCKET_NAME }} --recursive | wc -l)
        LOCAL_COUNT=$(find bucket-contents -type f | wc -l)
        
        echo "Local files: $LOCAL_COUNT"
        echo "Remote files: $REMOTE_COUNT"
        
        if [ "$REMOTE_COUNT" -ne "$LOCAL_COUNT" ]; then
          echo "⚠️ Warning: File count mismatch (local: $LOCAL_COUNT, remote: $REMOTE_COUNT)"
          echo "This might be expected if files were deleted"
        fi
        
        # Verify index.html exists
        if aws s3api head-object --bucket "${{ vars.BUCKET_NAME }}" --key "index.html" >/dev/null 2>&1; then
          echo "✅ index.html deployed successfully"
        else
          echo "❌ index.html not found in bucket"
          exit 1
        fi
    
    - name: Invalidate CloudFront with validation
      run: |
        echo "🔍 Finding CloudFront distribution..."
        DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='${{ vars.BUCKET_NAME }}.s3.amazonaws.com'].Id" --output text)
        
        if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
          echo "⚠️ No CloudFront distribution found for bucket ${{ vars.BUCKET_NAME }}"
          echo "Skipping cache invalidation"
        else
          echo "🔄 Invalidating CloudFront distribution: $DISTRIBUTION_ID"
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          if [ $? -eq 0 ]; then
            echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
            echo "🕐 Invalidation may take 5-15 minutes to complete"
          else
            echo "❌ Failed to create CloudFront invalidation"
            exit 1
          fi
        fi
    
    - name: Deployment summary
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "Environment: ${{ env.ENVIRONMENT }}"
        echo "Bucket: ${{ vars.BUCKET_NAME }}"
        echo "Region: ${{ env.AWS_REGION }}"
        echo ""
        echo "🌐 Your website should be available at:"
        echo "S3 Website: http://${{ vars.BUCKET_NAME }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
