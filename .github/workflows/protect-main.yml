name: Protect Main Branch

on:
  push:
    branches: ["main"]

jobs:
  block-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Block direct push to main
        run: |
          echo "❌ Direct pushes to main are not allowed."
          echo ""
          echo "This project uses two deployment branches:"
          echo "  dev  → GitHub Pages (fast iteration)"
          echo "  prod → S3 + CloudFront (production)"
          echo ""
          echo "To fix an accidental push to main:"
          echo "  git reset --hard HEAD~1"
          echo "  git checkout -b dev   # or prod"
          echo "  git push origin dev   # or prod"
          exit 1
